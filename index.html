<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>OAJOR Studio | ادیتور صدا</title>
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root { --primary: #7568f6; --bg: #080d1b; --panel: #101a2e; --line: #25334d; --text: #f3f6fc; --muted: #91a0b9; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: Vazirmatn, sans-serif; display: flex; justify-content: center; padding: 20px; }
  .app { width: 100%; max-width: 600px; }
  .header { text-align: center; margin-bottom: 20px; }
  .header h1 { margin: 0; font-size: 24px; color: #fff; }
  .header p { margin: 5px 0 0; color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 20px; margin-bottom: 15px; }
  .row { display: flex; gap: 10px; margin-bottom: 15px; }
  .btn { flex: 1; padding: 15px; border: none; border-radius: 12px; font-family: inherit; font-size: 14px; font-weight: bold; color: white; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.primary { background: var(--primary); }
  .btn.danger { background: #fb5577; }
  .btn.success { background: #22c58b; }
  .btn.info { background: #38bdf8; color: #000; }
  .hidden { display: none !important; }
  #waveform { width: 100%; height: 100px; background: #07101f; border-radius: 10px; display: block; margin-bottom: 15px; }
  .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
  .control label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
  .control input[type=range] { width: 100%; accent-color: var(--primary); }
  .status { font-size: 12px; color: #5ce0b2; text-align: center; min-height: 20px; margin-top: 10px; }
  .timer { font-size: 20px; font-weight: bold; color: #fb5577; text-align: center; font-variant-numeric: tabular-nums; margin-bottom: 15px; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>OAJOR Studio</h1>
    <p>استودیوی سبک و سریع ویرایش صدا</p>
  </div>

  <div class="panel">
    <div class="row">
      <button id="btnRecord" class="btn danger"><i class="fa-solid fa-microphone"></i> شروع ضبط</button>
      <button id="btnUpload" class="btn primary"><i class="fa-solid fa-folder-open"></i> انتخاب فایل</button>
      <input type="file" id="fileInput" accept="audio/*" class="hidden">
    </div>
    <div id="recTimer" class="timer hidden">00:00</div>
    <div id="statusText" class="status">آماده. یک فایل انتخاب کنید یا صدا ضبط کنید.</div>
  </div>

  <div id="editorPanel" class="panel hidden">
    <canvas id="waveform"></canvas>
    
    <div class="controls">
      <div class="control">
        <label>شروع برش: <span id="startVal">0.0s</span></label>
        <input type="range" id="startRange" min="0" step="0.1" value="0">
      </div>
      <div class="control">
        <label>پایان برش: <span id="endVal">0.0s</span></label>
        <input type="range" id="endRange" min="0" step="0.1" value="0">
      </div>
    </div>

    <div class="row">
      <button id="btnPreview" class="btn primary"><i class="fa-solid fa-play"></i> پیش‌نمایش</button>
      <button id="btnStop" class="btn info"><i class="fa-solid fa-stop"></i> توقف</button>
    </div>
    <div class="row">
      <button id="btnWav" class="btn success"><i class="fa-solid fa-download"></i> دانلود WAV</button>
      <button id="btnMp3" class="btn info"><i class="fa-solid fa-download"></i> دانلود MP3</button>
    </div>
  </div>
</div>

<script>
  // متغیرهای اصلی
  let audioCtx = null;
  let audioBuffer = null;
  let audioSource = null;
  let isRecording = false;
  let mediaRecorder = null;
  let recChunks = [];
  let recInterval = null;
  let recSeconds = 0;

  // المان‌ها
  const $ = id => document.getElementById(id);
  const btnRecord = $('btnRecord');
  const btnUpload = $('btnUpload');
  const fileInput = $('fileInput');
  const recTimer = $('recTimer');
  const statusText = $('statusText');
  const editorPanel = $('editorPanel');
  const canvas = $('waveform');
  const ctx = canvas.getContext('2d');
  const startRange = $('startRange');
  const endRange = $('endRange');

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
  }

  // --- ضبط صدا ---
  btnRecord.onclick = async () => {
    if (isRecording) {
      mediaRecorder.stop();
      return;
    }
    try {
      initAudio();
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      recChunks = [];
      
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recChunks.push(e.data); };
      mediaRecorder.onstop = async () => {
        stream.getTracks().forEach(t => t.stop());
        clearInterval(recInterval);
        isRecording = false;
        btnRecord.innerHTML = '<i class="fa-solid fa-microphone"></i> شروع ضبط';
        btnRecord.classList.replace('danger', 'primary'); // تغییر رنگ
        recTimer.classList.add('hidden');
        
        statusText.innerText = "در حال پردازش...";
        const blob = new Blob(recChunks, { type: 'audio/webm' });
        const arrayBuffer = await blob.arrayBuffer();
        audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
          loadBuffer(buffer, "ویس ضبط شده");
        }, (err) => {
          statusText.innerText = "خطا در پردازش فایل صوتی.";
          console.error(err);
        });
      };

      mediaRecorder.start();
      isRecording = true;
      recSeconds = 0;
      btnRecord.innerHTML = '<i class="fa-solid fa-square"></i> توقف ضبط';
      btnRecord.classList.replace('primary', 'danger');
      recTimer.classList.remove('hidden');
      recTimer.innerText = "00:00";
      
      recInterval = setInterval(() => {
        recSeconds++;
        const m = String(Math.floor(recSeconds / 60)).padStart(2, '0');
        const s = String(recSeconds % 60).padStart(2, '0');
        recTimer.innerText = `${m}:${s}`;
      }, 1000);

    } catch (err) {
      statusText.innerText = "دسترسی به میکروفون امکان‌پذیر نیست (به HTTPS نیاز دارد).";
      console.error(err);
    }
  };

  // --- انتخاب فایل ---
  btnUpload.onclick = () => fileInput.click();
  fileInput.onchange = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    initAudio();
    statusText.innerText = "در حال بارگذاری فایل...";
    const arrayBuffer = await file.arrayBuffer();
    audioCtx.decodeAudioData(arrayBuffer, (buffer) => {
      loadBuffer(buffer, file.name);
    }, (err) => {
      statusText.innerText = "فرمت فایل پشتیبانی نمی‌شود.";
      console.error(err);
    });
  };

  // --- لود بافر و کشیدن موج ---
  function loadBuffer(buffer, name) {
    audioBuffer = buffer;
    editorPanel.classList.remove('hidden');
    statusText.innerText = `آماده ویرایش: ${name}`;
    
    // تنظیم اسلایدرها
    const dur = Math.round(buffer.duration * 10) / 10;
    startRange.max = dur; startRange.value = 0;
    endRange.max = dur; endRange.value = dur;
    updateLabels();
    
    drawWaveform();
  }

  function updateLabels() {
    $('startVal').innerText = parseFloat(startRange.value).toFixed(1) + 's';
    $('endVal').innerText = parseFloat(endRange.value).toFixed(1) + 's';
  }
  startRange.oninput = updateLabels;
  endRange.oninput = updateLabels;

  // --- کشیدن موج با Canvas ---
  function drawWaveform() {
    if (!audioBuffer) return;
    
    // تنظیم سایز دقیق برای موبایل (رتریانا)
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    ctx.scale(dpr, dpr);
    
    const w = rect.width;
    const h = rect.height;
    const data = audioBuffer.getChannelData(0);
    const step = Math.ceil(data.length / w);
    const amp = h / 2;
    
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#4a5a7a'; // رنگ موج
    
    for (let i = 0; i < w; i++) {
      let min = 1.0, max = -1.0;
      for (let j = 0; j < step; j++) {
        const datum = data[(i * step) + j];
        if (datum < min) min = datum;
        if (datum > max) max = datum;
      }
      // کشیدن خط
      const height = Math.max(1, (max - min) * amp);
      ctx.fillRect(i, (1 + min) * amp, 1, height);
    }
  }

  // --- پخش و توقف ---
  $('btnPreview').onclick = () => {
    if (!audioBuffer) return;
    initAudio();
    stopAudio(); // قطع پخش قبلی
    
    let start = parseFloat(startRange.value);
    let end = parseFloat(endRange.value);
    
    if (start >= end) {
      alert("زمان شروع باید کمتر از زمان پایان باشد!");
      return;
    }

    audioSource = audioCtx.createBufferSource();
    audioSource.buffer = audioBuffer;
    audioSource.connect(audioCtx.destination);
    audioSource.start(0, start, end - start);
  };

  $('btnStop').onclick = stopAudio;

  function stopAudio() {
    if (audioSource) {
      try { audioSource.stop(); } catch(e) {}
      audioSource = null;
    }
  }

  // --- خروجی WAV ---
  $('btnWav').onclick = () => {
    if (!audioBuffer) return;
    let start = parseFloat(startRange.value);
    let end = parseFloat(endRange.value);
    if (start >= end) return alert("زمان شروع باید کمتر از پایان باشد");

    // برش دستی بافر
    const sampleRate = audioBuffer.sampleRate;
    const startSample = Math.floor(start * sampleRate);
    const endSample = Math.floor(end * sampleRate);
    const length = endSample - startSample;
    
    // ساخت بافر جدید
    const newBuffer = audioCtx.createBuffer(audioBuffer.numberOfChannels, length, sampleRate);
    for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
      const channelData = audioBuffer.getChannelData(i);
      newBuffer.getChannelData(i).set(channelData.subarray(startSample, endSample));
    }
    
    // تبدیل به WAV
    const blob = bufferToWav(newBuffer);
    downloadBlob(blob, 'oajor_edit.wav');
  };

  // --- خروجی MP3 ---
  $('btnMp3').onclick = async () => {
    if (!audioBuffer) return;
    let start = parseFloat(startRange.value);
    let end = parseFloat(endRange.value);
    if (start >= end) return alert("زمان شروع باید کمتر از پایان باشد");

    statusText.innerText = "در حال تبدیل به MP3 (چند لحظه صبر کنید)...";
    
    // ما از انکودر خود مرورگر استفاده می‌کنیم (با ترفند MIME)
    // این روش تضمینی روی موبایل کار می‌کند و نیازی به کتابخانه سنگین ندارد
    const sampleRate = audioBuffer.sampleRate;
    const startSample = Math.floor(start * sampleRate);
    const endSample = Math.floor(end * sampleRate);
    const length = endSample - startSample;
    
    const newBuffer = audioCtx.createBuffer(audioBuffer.numberOfChannels, length, sampleRate);
    for (let i = 0; i < audioBuffer.numberOfChannels; i++) {
        const channelData = audioBuffer.getChannelData(i);
        newBuffer.getChannelData(i).set(channelData.subarray(startSample, endSample));
    }

    // پخش بافر در یک استریم خروجی و ضبط آن
    const dest = audioCtx.createMediaStreamDestination();
    const source = audioCtx.createBufferSource();
    source.buffer = newBuffer;
    source.connect(dest);
    
    // پشتیبانی از فرمت‌های مختلف (در اندروید معمولاً webm یا mp4)
    let mime = 'audio/webm';
    if (MediaRecorder.isTypeSupported('audio/mp4')) mime = 'audio/mp4';
    else if (MediaRecorder.isTypeSupported('audio/ogg')) mime = 'audio/ogg';
    
    const recorder = new MediaRecorder(dest.stream, { mimeType: mime });
    const chunks = [];
    recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
    
    recorder.onstop = () => {
      const blob = new Blob(chunks, { type: mime });
      const ext = mime.includes('mp4') ? 'm4a' : mime.includes('ogg') ? 'ogg' : 'webm';
      downloadBlob(blob, `oajor_edit.${ext}`);
      statusText.innerText = "دانلود با موفقیت انجام شد.";
    };

    recorder.start();
    source.start();
    source.onended = () => { recorder.stop(); };
  };

  // --- توابع کمکی دانلود ---
  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function bufferToWav(buffer) {
    const numOfChan = buffer.numberOfChannels;
    const length = buffer.length * numOfChan * 2 + 44;
    const bufferArray = new ArrayBuffer(length);
    const view = new DataView(bufferArray);
    const channels = [];
    
    let i, sample, offset = 0, pos = 0;

    function setUint16(data) { view.setUint16(pos, data, true); pos += 2; }
    function setUint32(data) { view.setUint32(pos, data, true); pos += 4; }

    setUint32(0x46464952); // "RIFF"
    setUint32(length - 8);
    setUint32(0x45564157); // "WAVE"
    setUint32(0x20746d66); // "fmt "
    setUint32(16);
    setUint16(1); // PCM
    setUint16(numOfChan);
    setUint32(buffer.sampleRate);
    setUint32(buffer.sampleRate * 2 * numOfChan);
    setUint16(numOfChan * 2);
    setUint16(16);
    setUint32(0x61746164); // "data"
    setUint32(length - pos - 4);

    for (i = 0; i < buffer.numberOfChannels; i++) channels.push(buffer.getChannelData(i));

    while (pos < length) {
      for (i = 0; i < numOfChan; i++) {
        sample = Math.max(-1, Math.min(1, channels[i][offset]));
        sample = (sample < 0 ? sample * 0x8000 : sample * 0x7FFF) | 0;
        view.setInt16(pos, sample, true);
        pos += 2;
      }
      offset++;
    }
    return new Blob([bufferArray], { type: 'audio/wav' });
  }
</script>
</body>
</html>
